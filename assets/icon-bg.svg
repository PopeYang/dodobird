<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="呆呆鸟 DodoBird 图标">
  <title>呆呆鸟图标</title>
  <rect width="512" height="512" rx="96" fill="#FFF6E6"/>
  <!-- 背景小星星 -->
  <g fill="#F2C14E" opacity="0.9">
    <path transform="translate(80,88) scale(0.9)" d="M0,-9 L2.4,-2.4 9,0 2.4,2.4 0,9 -2.4,2.4 -9,0 -2.4,-2.4 Z"/>
    <path transform="translate(438,430) scale(0.75)" d="M0,-9 L2.4,-2.4 9,0 2.4,2.4 0,9 -2.4,2.4 -9,0 -2.4,-2.4 Z"/>
  </g>
  <svg x="44" y="44" width="424" height="424" viewBox="36 0 440 440">
    <!-- 大脑袋 -->
    <path d="M 196 408 C 146 392 108 336 108 248 C 106 118 178 62 256 62 C 334 62 406 118 404 248 C 404 336 366 392 316 408 C 288 418 224 418 196 408 Z"
          fill="#F2C73D" stroke="#262016" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill"/>
    <!-- 头顶呆毛 -->
    <path d="M 250 64 C 240 32 272 20 275 50 C 276 59 264 64 250 64 Z"
          fill="#F2C73D" stroke="#262016" stroke-width="6" stroke-linejoin="round" paint-order="stroke fill"/>
    <!-- 脸颊红晕 -->
    <ellipse cx="138" cy="285" rx="20" ry="13" fill="#F2A04E" opacity="0.35"/>
    <ellipse cx="374" cy="285" rx="20" ry="13" fill="#F2A04E" opacity="0.35"/>
    <!-- 垂下来的大嘴（塞在两眼之间） -->
    <g stroke="#262016" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">
      <path d="M 214 228 C 214 206 298 206 298 228 C 298 264 280 288 256 288 C 232 288 214 264 214 228 Z"
            fill="#E09140"/>
      <path d="M 226 270 C 226 306 240 330 256 330 C 272 330 286 306 286 270 Z"
            fill="#C07430"/>
    </g>
    <!-- 鼻孔 -->
    <ellipse cx="236" cy="232" rx="5" ry="3.5" fill="#8A5522" opacity="0.8" transform="rotate(-15 236 232)"/>
    <ellipse cx="276" cy="232" rx="5" ry="3.5" fill="#8A5522" opacity="0.8" transform="rotate(15 276 232)"/>
    <!-- 大白眼珠 -->
    <g fill="#FFFFFF" stroke="#262016" stroke-width="8" stroke-linejoin="round" paint-order="stroke fill">
      <ellipse cx="172" cy="198" rx="52" ry="64" transform="rotate(-10 172 198)"/>
      <ellipse cx="340" cy="198" rx="52" ry="64" transform="rotate(10 340 198)"/>
    </g>
    <!-- 豆豆眼珠 -->
    <ellipse cx="175" cy="222" rx="14" ry="18" fill="#262016"/>
    <ellipse cx="337" cy="222" rx="14" ry="18" fill="#262016"/>
    <!-- 眼神高光 -->
    <circle cx="170" cy="212" r="4.5" fill="#FFFFFF"/>
    <circle cx="332" cy="212" r="4.5" fill="#FFFFFF"/>
  </svg>
</svg>
